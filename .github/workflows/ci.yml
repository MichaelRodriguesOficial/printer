name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes no Windows (impressão real)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Criar impressora de teste que grava em arquivo
        shell: pwsh
        run: |
          Get-PrinterDriver | Select-Object -ExpandProperty Name
          $out = Join-Path $env:RUNNER_TEMP "ci-print-output.pdf"
          $driver = "Microsoft Print To PDF"
          $format = "pdf"
          if (-not (Get-PrinterDriver -Name $driver -ErrorAction SilentlyContinue)) {
            try { Add-PrinterDriver -Name $driver -ErrorAction Stop }
            catch {
              $driver = (Get-PrinterDriver | Select-Object -First 1).Name
              $format = "other"
              $out = Join-Path $env:RUNNER_TEMP "ci-print-output.bin"
            }
          }
          Add-PrinterPort -Name $out
          Add-Printer -Name "CI-Printer" -DriverName $driver -PortName $out
          Get-Printer | Format-Table Name, DriverName, PortName
          "PRINTER_CAV_TEST_PRINTER=CI-Printer" >> $env:GITHUB_ENV
          "PRINTER_CAV_TEST_OUTPUT=$out" >> $env:GITHUB_ENV
          "PRINTER_CAV_TEST_FORMAT=$format" >> $env:GITHUB_ENV

      - name: Instalar LibreOffice (alternativa ao Office)
        run: choco install libreoffice-fresh -y --no-progress
        timeout-minutes: 12
        continue-on-error: true  # o mirror do Chocolatey às vezes trava; os testes pulam sem LO

      - name: Testes
        run: python -m pytest -v -rs


  benchmark:
    name: Benchmark de impressão
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Criar impressoras virtuais (um driver de cada tipo disponível)
        shell: pwsh
        run: |
          $drivers = "Microsoft Print To PDF", "Microsoft IPP Class Driver",
                     "Microsoft PCL6 Class Driver", "Microsoft PS Class Driver",
                     "MS Publisher Color Printer", "Generic / Text Only"
          $list = @()
          foreach ($d in $drivers) {
            if (-not (Get-PrinterDriver -Name $d -ErrorAction SilentlyContinue)) {
              try { Add-PrinterDriver -Name $d -ErrorAction Stop }
              catch { "Driver indisponível: $d"; continue }
            }
            $safe = $d -replace '[^A-Za-z0-9]', ''
            $ext = if ($d -eq "Microsoft Print To PDF") { "pdf" } else { "out" }
            $out = Join-Path $env:RUNNER_TEMP "bench-$safe.$ext"
            try {
              Add-PrinterPort -Name $out -ErrorAction Stop
              Add-Printer -Name "Bench $d" -DriverName $d -PortName $out -ErrorAction Stop
              $list += "Bench $d|$out"
              "Impressora criada: Bench $d"
            } catch { "Falhou ao criar impressora com $d : $_" }
          }
          ($list -join ";") | Out-File -Encoding utf8 bench-printers.txt

      - name: Benchmark (raster x vetorial, conexão por arquivo x reaproveitada)
        shell: pwsh
        run: |
          foreach ($item in (Get-Content bench-printers.txt -Raw).Trim().Split(";")) {
            $name, $out = $item.Split("|")
            python tools/benchmark_print.py "$name" --paginas 20 --saida "$out"
          }

  build:
    name: Gerar executável
    needs: testes
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: PyInstaller
        run: python tools/build.py

      - name: Autoteste do executável
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PrinterCAV.exe -ArgumentList "--self-test" -Wait -PassThru
          "Código de saída: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\PrinterCAV\logs\printer.log" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Capturas de tela
        run: python tools/screenshot.py screenshots

      - uses: actions/upload-artifact@v5
        with:
          name: PrinterCAV-${{ github.sha }}
          path: dist/PrinterCAV.exe

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots/*.png

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrinterCAV.exe
          generate_release_notes: true
